spring.application.name=foodcal_backend

# Load secrets from project-root .env (Spring Boot 4 does not read .env by itself)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${HOST_NAME}/${DATABASE}
spring.datasource.username=${USER}
spring.datasource.password=${PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.avatar-bucket=${SUPABASE_AVATAR_BUCKET}

# Real values live in .env or OS env vars (JWT_SECRET, JWT_EXPIRATION, FRONTEND_URL)
jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}
env.frontend.url=${FRONTEND_URL}
