spring.application.name=foodcal_backend

# Load secrets from project-root .env (Spring Boot 4 does not read .env by itself)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/foodcal_db
spring.datasource.username=foodcal
spring.datasource.password=foodcal

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Real values live in .env or OS env vars (JWT_SECRET, JWT_EXPIRATION, FRONTEND_URL)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
env.frontend.url=${FRONTEND_URL}